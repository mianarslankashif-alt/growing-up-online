<svg viewBox="0 0 400 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <title>Wireframe — Home page, mobile</title>
  <rect width="400" height="900" fill="#ffffff" stroke="#ccc"/>
  <text x="20" y="20" font-size="10" fill="#999">LOW-FI WIREFRAME — HOME — MOBILE (375px)</text>
  <!-- header, wraps -->
  <rect x="0" y="26" width="400" height="90" fill="#e8e8e8" stroke="#999"/>
  <rect x="16" y="38" width="120" height="20" fill="#bbb"/>
  <g fill="#ccc" stroke="#999">
    <rect x="16" y="68" width="60" height="20"/>
    <rect x="84" y="68" width="90" height="20"/>
    <rect x="182" y="68" width="80" height="20"/>
    <rect x="16" y="94" width="90" height="20"/>
    <rect x="114" y="94" width="60" height="20"/>
    <rect x="182" y="94" width="70" height="20"/>
  </g>
  <!-- hero, stacked -->
  <rect x="0" y="116" width="400" height="220" fill="#f2f2f2" stroke="#999"/>
  <rect x="16" y="136" width="90" height="20" fill="#ddd"/>
  <rect x="16" y="168" width="368" height="26" fill="#ccc"/>
  <rect x="16" y="200" width="300" height="26" fill="#ccc"/>
  <rect x="16" y="240" width="368" height="12" fill="#e2e2e2"/>
  <rect x="16" y="258" width="368" height="12" fill="#e2e2e2"/>
  <rect x="16" y="276" width="260" height="12" fill="#e2e2e2"/>
  <!-- stacked era cards, single column -->
  <text x="16" y="368" font-size="14" fill="#666">Explore the eras</text>
  <g fill="#f6f6f6" stroke="#999">
    <rect x="16" y="380" width="368" height="90"/>
    <rect x="16" y="480" width="368" height="90"/>
    <rect x="16" y="580" width="368" height="90"/>
    <rect x="16" y="680" width="368" height="90"/>
  </g>
  <!-- footer -->
  <rect x="0" y="800" width="400" height="80" fill="#e8e8e8" stroke="#999"/>
  <rect x="16" y="816" width="368" height="12" fill="#ccc"/>
  <rect x="16" y="836" width="300" height="12" fill="#ccc"/>
</svg>
